image: python:latest

pipelines:
  default:
      - step:
          name: Python2.7
          image: python:2.7
          script:
            - pip install -U tox
            - tox -e py27
          caches:
            - pip
      - step:
          name: Python3.7
          images: python:3.7
          script:
            - pip install -U tox
            - tox -e py37
          caches:
            - pip
  branches:
    master:
      - step:
          name: Python2.7
          image: python:2.7
          script:
            - pip install -U tox
            - tox -e py27
          caches:
            - pip
      - step:
          name: Python3.6
          images: python:3.6
          script:
            - pip install -U tox
            - tox -e py36
          caches:
            - pip
      - step:
          name: Python3.7
          images: python:3.7
          script:
            - pip install -U tox
            - tox -e py37
          caches:
            - pip
      - step:
          name: Documentation
          script:
            - pip install -U tox
            - tox -e docs
          caches:
            - pip
      - step:
          name: Deploy To PyPi
          script:
            - bash -e deploy.bash
